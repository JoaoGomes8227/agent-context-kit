name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and behavioral suite
        run: PYTHONPATH=src python3 tests/run.py
      - name: Public sanitization scan
        run: python3 scripts/check_public.py
      - name: Shell syntax
        run: bash -n install.sh scripts/install.sh scripts/uninstall.sh scripts/agent-context-kit
      - name: Whitespace
        run: git diff-tree --check --root -r HEAD
